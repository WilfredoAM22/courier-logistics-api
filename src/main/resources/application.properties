spring.application.name=courier-logistics-api
server.port=${PORT:8081}

#Modo que se usara cuando se inicie la db tables | new-tables-class | verification-tables
spring.profiles.active=new-tables-class
spring.datasource.url=jdbc:h2:file:./data/micourierdb
spring.datasource.username=sebastian
spring.datasource.password=${DB_PASSWORD:localdev123}
#

spring.h2.console.enabled=true
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

#---

# Comportamiento de Hibernate
spring.config.activate.on-profile=tables
spring.jpa.hibernate.ddl-auto=create-drop
#---
spring.config.activate.on-profile=new-tables-class
spring.jpa.hibernate.ddl-auto=update
#---
spring.config.activate.on-profile=verification-tables
spring.jpa.hibernate.ddl-auto=validate
